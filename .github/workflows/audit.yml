name: agent-spec Compliance Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI & Transpiler Engine
        run: npm run build

      - name: Run Tier-5 Skill Linter & Compliance Audit
        run: npm test

      - name: Test Multi-IDE Compiler Sync
        run: npm run sync
